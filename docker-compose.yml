services:
  db:
    image: postgres:16
    container_name: traceveil-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: traceveil
      POSTGRES_PASSWORD: traceveil_dev
      POSTGRES_DB: traceveil
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceveil -d traceveil"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: